name: Temporary gallery modal details

on:
  push:
    paths:
      - '.github/workflows/tmp-gallery-modal-details.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch gallery modal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/js/pages/gallery.js')
          s = p.read_text()
          old = '''        modalTitle.textContent = item.title;\n        modalLocation.textContent = item.location || tr("gallery.horizonRoute", "HORIZON route");\n        modalDescription.textContent = item.description || tr("gallery.horizonGalleryEntry", "HORIZON gallery entry.");\n'''
          new = '''        modalTitle.textContent = item.title;\n        const modalMeta = [\n            item.location || '',\n            item.date || '',\n            item.time || '',\n            item.km ? `${item.km} km` : ''\n        ].filter(Boolean);\n        modalLocation.textContent = modalMeta.join(' · ');\n        modalLocation.hidden = modalMeta.length === 0;\n\n        const description = String(item.description || '').trim();\n        modalDescription.textContent = description;\n        modalDescription.hidden = !description;\n'''
          if old not in s:
              raise SystemExit('Expected gallery modal block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/js/pages/gallery.js
          git commit -m "feat: show photo time and distance in gallery modal"
          git push origin HEAD:main
