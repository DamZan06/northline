<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="replay.horizonExpeditionReplay">NorthLine 2.0 · Expedition Replay</title>
    <meta name="description" content="Relive the NorthLine 2.0 crossing with cinematic replay controls: play, pause, reset and speed control." data-i18n-attr='{"content":"meta.replayDescription"}'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://damzan06.github.io/NorthLineWeb/assets/northline_social_preview.png?v=20260827a"><meta property="og:image:secure_url" content="https://damzan06.github.io/NorthLineWeb/assets/northline_social_preview.png?v=20260827a"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://damzan06.github.io/NorthLineWeb/assets/northline_social_preview.png?v=20260827a">
    <link rel="stylesheet" href="css/tokens.css?v=20260828d">
    <link rel="stylesheet" href="css/global.css?v=20260828q">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo_northline_homepage.png?v=20260827a">
    <link rel="icon" type="image/png" href="assets/logo_northline_homepage.png?v=20260827a">
    <link rel="apple-touch-icon" href="assets/logo_northline_homepage.png?v=20260827a">
</head>
<body data-page="replay">
    <a href="#main" class="skip-link" data-i18n="common.skipToMainContent">Skip to main content</a>
    <header class="topbar">
        <a href="index.html" class="brand" aria-label="NorthLine 2.0 home" data-i18n-attr='{"aria-label":"common.horizonHome"}'>
            <img src="assets/logo_northline_homepage.png?v=20260827a" alt="NorthLine 2.0 logo" class="brand-icon" data-i18n-attr='{"alt":"common.horizonLogo"}'>
            <div>
                <span class="brand-title" data-i18n="common.projectName">NorthLine 2.0</span>
                <span class="brand-subtitle" data-i18n="common.replay">Replay</span>
            </div>
        </a>
        <nav class="main-nav" aria-label="Main navigation" data-i18n-attr='{"aria-label":"common.mainNavigation"}'>
            <a href="index.html" data-i18n="common.home">Home</a>
            <a href="live.html" data-i18n="common.live">Live</a>
            <a href="project.html" data-i18n="common.project">Project</a>
            <a href="gallery.html" data-i18n="common.journey">Journey</a>
            <a href="replay.html" aria-current="page" data-i18n="common.replay">Replay</a>
        </nav>
    </header>
    <main id="main" class="page page-replay">
        <section class="section">
            <div class="section-title">
                <p class="eyebrow" data-i18n="common.replay">Replay</p>
                <h1 data-i18n="replay.reliveTheRoute">Relive the route.</h1>
            </div>
            <div class="map-wrap">
                <div id="replayMapStatus" class="map-status" aria-live="polite" data-i18n="replay.loadingReplayMap">Loading replay map...</div>
                <div id="map"></div>
                <div class="map-actions" aria-label="Map controls" data-i18n-attr='{"aria-label":"common.mapControls"}'>
                    <button id="replayPlay" class="map-toggle-btn replay-control-button primary" type="button" title="Start replay" aria-label="Start replay" data-i18n-attr='{"aria-label":"replay.startReplay","title":"replay.startReplay"}'><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"/></svg></button>
                    <button id="replayReset" class="map-toggle-btn replay-control-button" type="button" title="Restart replay" aria-label="Restart replay" data-i18n-attr='{"aria-label":"replay.restartReplay","title":"replay.restartReplay"}'><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-4.33 7.5l-1.73 1A7 7 0 1 0 12 5Z"/></svg></button>
                    <button id="replayMapZoomInBtn" type="button" class="map-toggle-btn" title="Zoom in" aria-label="Zoom in" data-i18n-attr='{"aria-label":"common.zoomIn","title":"common.zoomIn"}'>+</button>
                    <button id="replayMapZoomOutBtn" type="button" class="map-toggle-btn" title="Zoom out" aria-label="Zoom out" data-i18n-attr='{"aria-label":"common.zoomOut","title":"common.zoomOut"}'>&minus;</button>
                    <button id="replayMapCenterBtn" type="button" class="map-toggle-btn" title="Center on replay position" aria-label="Center on replay position" data-i18n-attr='{"aria-label":"replay.centerOnReplayPosition","title":"replay.centerOnReplayPosition"}'><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.75a9.25 9.25 0 1 0 9.25 9.25A9.26 9.26 0 0 0 12 2.75Zm0 4.75a4.5 4.5 0 1 1-4.5 4.5A4.5 4.5 0 0 1 12 7.5Zm0 11.75a7.84 7.84 0 0 1-5.85-2.67A8.63 8.63 0 0 1 12 14.5a8.63 8.63 0 0 1 5.85 2.08A7.84 7.84 0 0 1 12 19.25Z"/></svg></button>
                    <button id="replayMapLayerBtn" type="button" class="map-toggle-btn" title="Change map layer" aria-label="Change map layer" data-i18n-attr='{"aria-label":"common.changeMapLayer","title":"common.changeMapLayer"}'><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Zm-7.1 8.2L12 15l7.1-3.8L21 12.3l-9 5-9-5 1.9-1.1Zm0 4L12 19l7.1-3.8 1.9 1.1-9 5-9-5 1.9-1.1Z"/></svg></button>
                    <button id="replayMapFullscreenBtn" type="button" class="map-toggle-btn" title="Open fullscreen map" aria-label="Open fullscreen map" data-i18n-attr='{"aria-label":"common.openFullscreenMap","title":"common.openFullscreenMap"}'>&#x26F6;</button>
                </div>
                <span id="replayStatus" class="replay-status" aria-live="polite" data-i18n="replay.replayReady">Replay ready</span>
            </div>
            <div class="replay-map-speed" aria-label="Replay speed" data-i18n-attr='{"aria-label":"replay.replaySpeed"}'>
                <span class="replay-map-speed-label" data-i18n="common.speed">Speed</span>
                <div class="replay-speed-options" role="group" aria-label="Replay speed presets" data-i18n-attr='{"aria-label":"replay.replaySpeedPresets"}'>
                    <button class="replay-speed-option" type="button" data-speed="slow">0.5x</button>
                    <button class="replay-speed-option is-active" type="button" data-speed="normal" aria-pressed="true">1x</button>
                    <button class="replay-speed-option" type="button" data-speed="fast">2x</button>
                    <button class="replay-speed-option" type="button" data-speed="very-fast">4x</button>
                </div>
                <output id="replaySpeedLabel">1x</output>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <p data-i18n="common.horizon2026AcrossSwitzerlandEastToWest">NorthLine 2.0 © 2026 · Switzerland, north to south. Solo and unsupported.</p>
    </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/config.js?v=20260828g"></script>
    <script src="js/firebase.js?v=20260828d"></script>
    <script src="js/i18n.js?v=20260828l"></script>
    <script src="js/locales/en.js?v=20260828m"></script>
    <script src="js/locales/it.js?v=20260828m"></script>
    <script src="js/locales/de.js?v=20260828m"></script>
    <script src="js/locales/fr.js?v=20260828m"></script>
    <script src="js/ui/navigation.js?v=20260828k"></script>
    <script src="js/status.js?v=20260828k"></script>
    <script src="js/stats.js?v=20260828b"></script>
    <script src="js/route.js?v=20260828a"></script>
    <script src="js/map.js?v=20260828m"></script>
    <script src="js/expedition.js?v=20260828d"></script>
    <script src="js/app.js?v=20260828k"></script>
    <script src="js/pages/replay.js?v=20260828k"></script>
</body>
</html>
