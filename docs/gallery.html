    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo_northline_homepage.png?v=20260827a">

<body data-page="gallery">
    <a href="#main" class="skip-link" data-i18n="common.skipToMainContent">Skip to main content</a>
    <header class="topbar">
        <a href="index.html" class="brand" aria-label="NorthLine 2.0 home" data-i18n-attr='{"aria-label":"common.horizonHome"}'>
            <img src="assets/logo_northline_homepage.png?v=20260827a" alt="NorthLine 2.0 logo" class="brand-icon" data-i18n-attr='{"alt":"common.horizonLogo"}'>
            <div>
                <span class="brand-title" data-i18n="common.projectName">NorthLine 2.0</span>
                <span class="brand-subtitle" data-i18n="common.fieldNotes">Field Notes</span>
            </div>
        </a>
        <nav class="main-nav" aria-label="Main navigation" data-i18n-attr='{"aria-label":"common.mainNavigation"}'>
            <a href="index.html" data-i18n="common.home">Home</a>
            <a href="live.html" data-i18n="common.live">Live</a>
            <a href="project.html" data-i18n="common.project">Project</a>
            <a href="gallery.html" aria-current="page" data-i18n="common.journey">Journey</a>
            <a href="replay.html" data-i18n="common.replay">Replay</a>
        </nav>
    </header>
    <main id="main" class="page page-gallery">
        <section class="section">
            <div class="section-title gallery-title-row">
                <div>
                    <p class="eyebrow" data-i18n="gallery.photographs">Photographs</p>
                    <h1 data-i18n="gallery.fullJourneyGallery">Full journey gallery</h1>
                </div>
            </div>
            <div class="map-wrap map-wrap-photo-gallery">
                <div class="map-status" data-map-status="gallery" aria-live="polite" data-i18n="gallery.loadingPhotoMap">Loading photo map...</div>
                <div id="map"></div>
                <div class="map-actions">
                    <button id="galleryMapZoomInBtn" type="button" class="map-toggle-btn" title="Zoom in" aria-label="Zoom in" data-i18n-attr='{"aria-label":"common.zoomIn","title":"common.zoomIn"}'>+</button>
                    <button id="galleryMapZoomOutBtn" type="button" class="map-toggle-btn" title="Zoom out" aria-label="Zoom out" data-i18n-attr='{"aria-label":"common.zoomOut","title":"common.zoomOut"}'>&minus;</button>
                    <button id="galleryPhotoMapFullscreenBtn" type="button" class="map-toggle-btn" title="Open fullscreen map" aria-label="Open fullscreen map" data-i18n-attr='{"aria-label":"common.openFullscreenMap","title":"common.openFullscreenMap"}'>&#x26F6;</button>
                </div>
            </div>
            <div class="gallery-grid" aria-live="polite"></div>
        </section>
    </main>
    <div class="modal-backdrop" role="dialog" aria-modal="true">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close" data-i18n-attr='{"aria-label":"common.close"}'>X</button>
            <button class="modal-nav modal-prev" id="modalPrev" aria-label="Previous image" data-i18n-attr='{"aria-label":"gallery.previousImage"}'>《</button>
            <button class="modal-nav modal-next" id="modalNext" aria-label="Next image" data-i18n-attr='{"aria-label":"gallery.nextImage"}'>》</button>
            <img id="modalImage" src="assets/preview_link_horizon.png" alt="">
            <div class="modal-details">
                <h3 id="modalTitle" data-i18n="gallery.imageTitle">Image title</h3>
                <p id="modalLocation" data-i18n="common.location">Location</p>
                <p id="modalDescription" data-i18n="gallery.photoDescriptionAndMapPosition">Photo description and map position.</p>
            </div>
        </div>
    </div>
    <footer class="site-footer">
        <p data-i18n="common.horizon2026AcrossSwitzerlandEastToWest">NorthLine 2.0 © 2026 · Switzerland, north to south. Solo and unsupported.</p>
    </footer>
